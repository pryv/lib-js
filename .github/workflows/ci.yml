name: Open Pryv.io CI

on:
  pull_request:
    branches:
      - '*'
  push:
    branches:
      - 'master'

jobs:
  build:
    runs-on: ubuntu-22.04

    strategy:
      matrix:
        node-version: [22.18.0]

    steps:
    - name: Install `just`
      uses: extractions/setup-just@69d82fb0233557aec017ef13706851d0694e0f1d # v1.6.0

    - name: Checkout repository with submodules
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

    - name: Install Node.js with version ${{ matrix.node-version }}
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
      with:
        node-version: ${{ matrix.node-version }}


    - name: Setup Dev Env
      run: |
        npm install

    - name: Run tests on all components
      run: |
        IS_CI=true just test-cover-ci

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@e0b68c6749509c5f83f984dd99a76a1c1a231044 # v4.0.1
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        slug: pryv/lib-js